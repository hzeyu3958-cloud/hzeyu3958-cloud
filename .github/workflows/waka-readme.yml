name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update WakaTime stats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README with WakaTime stats
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import date, timedelta
          from pathlib import Path

          readme_path = Path("README.md")
          start = "<!--START_SECTION:waka-->"
          end = "<!--END_SECTION:waka-->"
          api_key = os.environ.get("WAKATIME_API_KEY", "").strip()

          def make_bar(percent):
              filled = max(0, min(20, round(percent / 5)))
              return "█" * filled + "░" * (20 - filled)

          if not api_key:
              body = "> WakaTime API Key 配置后，这里会自动更新最近一周的编码统计。"
          else:
              token = base64.b64encode(api_key.encode()).decode()
              today = date.today()
              start_date = today - timedelta(days=6)
              query = urllib.parse.urlencode({
                  "start": start_date.isoformat(),
                  "end": today.isoformat(),
              })
              req = urllib.request.Request(
                  f"https://api.wakatime.com/api/v1/users/current/summaries?{query}",
                  headers={"Authorization": f"Basic {token}"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))

              total_seconds = 0
              language_seconds = {}
              for day in payload.get("data", []):
                  total_seconds += float(day.get("grand_total", {}).get("total_seconds") or 0)
                  for lang in day.get("languages", []):
                      name = lang.get("name", "Other")
                      language_seconds[name] = language_seconds.get(name, 0) + float(lang.get("total_seconds") or 0)

              def human(seconds):
                  seconds = int(seconds)
                  hours, rem = divmod(seconds, 3600)
                  minutes = rem // 60
                  if hours:
                      return f"{hours} hrs {minutes} mins"
                  if minutes:
                      return f"{minutes} mins"
                  return "0 mins"

              total = human(total_seconds)
              daily = human(total_seconds / 7)
              languages = sorted(language_seconds.items(), key=lambda item: item[1], reverse=True)[:6]

              lines = [
                  f"**本周编码时间:** `{total}`",
                  f"**日均编码时间:** `{daily}`",
                  "",
                  "```text",
              ]
              if languages and total_seconds > 0:
                  for name, seconds in languages:
                      text = human(seconds)
                      percent = seconds / total_seconds * 100
                      lines.append(f"{name:<16} {make_bar(percent)} {percent:5.1f}%  {text}")
              else:
                  lines.append("暂无 WakaTime 编码数据，安装插件并编码一段时间后会显示。")
              lines.append("```")
              body = "\n".join(lines)

          readme = readme_path.read_text(encoding="utf-8")
          if start not in readme or end not in readme:
              raise SystemExit("README markers not found")

          before = readme.split(start, 1)[0]
          rest = readme.split(start, 1)[1]
          after = rest.split(end, 1)[1]
          updated = f"{before}{start}\n{body}\n{end}{after}"
          readme_path.write_text(updated, encoding="utf-8", newline="\n")
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already up to date."
          else
            git commit -m "docs: update WakaTime stats"
            git push
          fi
